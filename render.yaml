services:
  - type: web
    name: rad-x
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: bash deploy/start.sh
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RADX_MODEL_PATH
        value: /tmp/rad-x/chest_xray_finetuned_best.pth
      - key: DROPBOX_FILE_PATH
        value: /RAD-X/chest_xray_finetuned_best.pth
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
