services:
  - type: web
    name: rad-x
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: bash deploy/start.sh
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RADX_MODEL_PATH
        value: /opt/render/project/src/models/chest_xray_finetuned_best.pth
      - key: RADX_MODEL_URL
        sync: false
